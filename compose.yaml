services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ALERTS_POSTGRES_DB:-alertsd}
      POSTGRES_USER: ${ALERTS_POSTGRES_USER:-alertsd}
      POSTGRES_PASSWORD: ${ALERTS_POSTGRES_PASSWORD:?set ALERTS_POSTGRES_PASSWORD}
    volumes:
      - alerts-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: &rotated-logs
      driver: json-file
      options:
        max-size: ${ALERTS_LOG_MAX_SIZE:-20m}
        max-file: ${ALERTS_LOG_MAX_FILES:-5}

  alertsd:
    build: .
    environment:
      ALERTS_HTTP_ADDR: :8100
      ALERTS_API_TOKEN: ${ALERTS_API_TOKEN:?set ALERTS_API_TOKEN}
      ALERTS_INGEST_TOKEN: ${ALERTS_INGEST_TOKEN:?set ALERTS_INGEST_TOKEN}
      ALERTS_DATABASE_URL: "postgres://${ALERTS_POSTGRES_USER:-alertsd}:${ALERTS_POSTGRES_PASSWORD:?set ALERTS_POSTGRES_PASSWORD}@postgres:5432/${ALERTS_POSTGRES_DB:-alertsd}?sslmode=disable"
      ALERTS_NATS_URL: ${ALERTS_NATS_URL:-nats://nats:4222}
      ALERTS_NATS_TOKEN: ${ALERTS_NATS_TOKEN:?set ALERTS_NATS_TOKEN}
      ALERTS_NATS_DURABLE: ${ALERTS_NATS_DURABLE:-ALERTS_EVALUATOR_V3}
      ALERTS_NATS_REPLICAS: ${ALERTS_NATS_REPLICAS:-1}
      ALERTS_NATS_ACK_WAIT: ${ALERTS_NATS_ACK_WAIT:-30s}
      ALERTS_NATS_MAX_DELIVERIES: ${ALERTS_NATS_MAX_DELIVERIES:-20}
      ALERTS_WORKER_INDEX: ${ALERTS_WORKER_INDEX:-0}
      ALERTS_WORKER_COUNT: ${ALERTS_WORKER_COUNT:-1}
      ALERTS_EVALUATION_BATCH_SIZE: ${ALERTS_EVALUATION_BATCH_SIZE:-32}
      ALERTS_DEFINITION_REFRESH_INTERVAL: ${ALERTS_DEFINITION_REFRESH_INTERVAL:-250ms}
      ALERTS_DEFINITION_ACTIVATION_DELAY: ${ALERTS_DEFINITION_ACTIVATION_DELAY:-2s}
      ALERTS_DEFINITION_MAX_STALENESS: ${ALERTS_DEFINITION_MAX_STALENESS:-1s}
      ALERTS_MAINTENANCE_INTERVAL: ${ALERTS_MAINTENANCE_INTERVAL:-1h}
      ALERTS_PROVISIONAL_INBOX_RETENTION: ${ALERTS_PROVISIONAL_INBOX_RETENTION:-48h}
      ALERTS_CONFIRMED_INBOX_RETENTION: ${ALERTS_CONFIRMED_INBOX_RETENTION:-720h}
      ALERTS_EVENT_RETENTION: ${ALERTS_EVENT_RETENTION:-8760h}
      ALERTS_MAINTENANCE_BATCH_SIZE: ${ALERTS_MAINTENANCE_BATCH_SIZE:-5000}
      ALERTS_INSTANCE_ID: ${ALERTS_INSTANCE_ID:-alertsd}
      ALERTS_PARTITION_LEASE_TTL: ${ALERTS_PARTITION_LEASE_TTL:-15s}
      ALERTS_PARTITION_LEASE_RENEW_INTERVAL: ${ALERTS_PARTITION_LEASE_RENEW_INTERVAL:-5s}
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, event-bus]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *rotated-logs

volumes:
  alerts-postgres:

networks:
  default: {}
  event-bus:
    external: true
    name: ${ALERTS_NATS_NETWORK:-signald_backend}
